[env:universe_esp8266_2m]
extends = env:esp8266_2m
upload_speed = 460800
build_flags = ${env:esp8266_2m.build_flags}
  -D PIXEL_COUNTS=110
  -D DATA_PINS=2
  -D WLED_DEFAULT_BOOT_COLOR=0x006400
  -D WLED_DEFAULT_BOOT_BRIGHTNESS=255

[env:universe_esp32dev]
extends = env:esp32dev
upload_speed = 921600
build_flags = ${env:esp32dev.build_flags}
  -D PIXEL_COUNTS=110
  -D WLED_DISABLE_PARTICLESYSTEM2D
  -D DATA_PINS=33
  -D WLED_DEFAULT_BOOT_COLOR=0x006400
  -D WLED_DEFAULT_BOOT_BRIGHTNESS=255
